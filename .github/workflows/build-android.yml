name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "No lockfile found, generating..."
            npm install --package-lock-only
          fi
          npm ci

      - name: Build Next.js (skip db:push in CI)
        run: npx next build

      - name: Prepare web directory for Capacitor
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><title>Chakki Mitra</title></head><body></body></html>' > out/index.html

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6.2.0

      - name: Add Android platform
        run: npx cap add android

      - name: Copy custom SMS plugin
        run: |
          mkdir -p android/app/src/main/java/com/chakkimitra/plugin
          cp native/android-plugin/com/chakkimitra/plugin/BackgroundSmsPlugin.java \
             android/app/src/main/java/com/chakkimitra/plugin/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/android-signing/release.keystore"

          KEYSTORE_PATH=$(realpath "$RUNNER_TEMP/android-signing/release.keystore")

          # Write gradle.properties with actual values (not env vars)
          cat > android/gradle.properties << EOF
          RELEASE_STORE_FILE=$KEYSTORE_PATH
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Patch build.gradle for signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          # Inject signingConfigs and override buildTypes release
          python3 -c "
          import re
          with open('app/build.gradle', 'r') as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(RELEASE_STORE_FILE)
                      storePassword RELEASE_STORE_PASSWORD
                      keyAlias RELEASE_KEY_ALIAS
                      keyPassword RELEASE_KEY_PASSWORD
                  }
              }
          '''

          # Add signingConfigs before buildTypes if not present
          if 'signingConfigs' not in content:
              content = content.replace(
                  'buildTypes {',
                  signing_block + '    buildTypes {'
              )

          # Ensure buildTypes release uses signingConfig
          if 'signingConfig signingConfigs.release' not in content:
              content = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1 signingConfig signingConfigs.release',
                  content
              )

          with open('app/build.gradle', 'w') as f:
              f.write(content)
          "

      - name: Get version code
        id: version
        run: |
          VERSION_CODE=$(($(date +%-y) * 10000 + $(date +%-m) * 100 + $(date +%-d)))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$(date +%Y.%-m.%-d)" >> "$GITHUB_OUTPUT"

      - name: Update version in build.gradle
        run: |
          cd android
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" app/build.gradle

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Cleanup signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: chakki-mitra-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: chakki-mitra-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chakki-mitra-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: Chakki Mitra v${{ steps.version.outputs.version_name }}
          tag_name: v${{ steps.version.outputs.version_name }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
