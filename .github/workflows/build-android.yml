name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check signing secrets
        id: check-signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "No lockfile found, generating..."
            npm install --package-lock-only
          fi
          npm ci

      - name: Build Next.js static export
        run: npm run build:apk

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6.2.0

      - name: Add Android platform
        run: npx cap add android

      - name: Copy custom SMS plugin
        run: |
          mkdir -p android/app/src/main/java/com/chakkimitra/plugin
          cp native/android-plugin/com/chakkimitra/plugin/BackgroundSmsPlugin.java \
             android/app/src/main/java/com/chakkimitra/plugin/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure signing
        if: steps.check-signing.outputs.has_signing == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/android-signing/release.keystore"
          KEYSTORE_PATH=$(realpath "$RUNNER_TEMP/android-signing/release.keystore")
          cd android
          printf 'RELEASE_STORE_FILE=%s\n' "$KEYSTORE_PATH" > gradle.properties
          printf 'RELEASE_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> gradle.properties
          printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> gradle.properties
          printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> gradle.properties

      - name: Patch build.gradle for signing
        if: steps.check-signing.outputs.has_signing == 'true'
        run: |
          cd android
          python3 << 'PYEOF'
          import re
          with open("app/build.gradle", "r") as f:
              content = f.read()
          signing = (
              "    signingConfigs {\n"
              "        release {\n"
              "            storeFile file(RELEASE_STORE_FILE)\n"
              "            storePassword RELEASE_STORE_PASSWORD\n"
              "            keyAlias RELEASE_KEY_ALIAS\n"
              "            keyPassword RELEASE_KEY_PASSWORD\n"
              "        }\n"
              "    }\n"
          )
          if "signingConfigs" not in content:
              content = content.replace("buildTypes {", signing + "    buildTypes {")
          if "signingConfig signingConfigs.release" not in content:
              content = re.sub(r"(release\s*\{)", r"\1 signingConfig signingConfigs.release", content)
          with open("app/build.gradle", "w") as f:
              f.write(content)
          PYEOF

      - name: Get version code
        id: version
        run: |
          VERSION_CODE=$(($(date +%-y) * 10000 + $(date +%-m) * 100 + $(date +%-d)))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$(date +%Y.%-m.%-d)" >> "$GITHUB_OUTPUT"

      - name: Update version in build.gradle
        run: |
          cd android
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" app/build.gradle

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Cleanup signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: chakki-mitra-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: chakki-mitra-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chakki-mitra-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.check-signing.outputs.has_signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Chakki Mitra v${{ steps.version.outputs.version_name }}
          tag_name: v${{ steps.version.outputs.version_name }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
