name: Build Android APK

on:
  push:
    tags:
      - 'v*'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check signing secrets
        id: check-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "No lockfile found, generating..."
            npm install --package-lock-only
          fi
          npm ci

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_API_BASE_URL: https://chakki-mitra.vercel.app
        run: npm run build:apk

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6.2.0

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android SDK versions
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("android/variables.gradle")
          text = path.read_text()
          replacements = {
              "compileSdkVersion = 34": "compileSdkVersion = 35",
              "targetSdkVersion = 34": "targetSdkVersion = 35",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          grep -E 'compileSdkVersion|targetSdkVersion|minSdkVersion' android/variables.gradle

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.SEND_SMS" />\n    <uses-permission android:name="android.permission.READ_SMS" />' "$MANIFEST"

      - name: Add auth deep-link intent-filter
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          snippet = "\n".join([
              "            <intent-filter>",
              '                <action android:name="android.intent.action.VIEW" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '                <category android:name="android.intent.category.BROWSABLE" />',
              '                <data android:scheme="chakkimitra" android:host="auth" />',
              "            </intent-filter>",
              "",
          ])
          if "chakkimitra" not in text:
              text = text.replace("</activity>", snippet + "        </activity>", 1)
          path.write_text(text)
          PY
          grep -B2 -A6 'chakkimitra' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Patch Android for SMS plugin
        run: |
          # Copy pre-built MainActivity.java (includes plugin registration)
          MAIN_DIR="android/app/src/main/java/com/chakkimitra/app"
          mkdir -p "$MAIN_DIR"
          cp native/android/app/src/main/java/com/chakkimitra/app/MainActivity.java "$MAIN_DIR/"
          echo "=== MainActivity.java copied ==="
          cat "$MAIN_DIR/MainActivity.java"

          # Copy plugin Java file
          PLUGIN_DIR="android/app/src/main/java/com/chakkimitra/plugin"
          mkdir -p "$PLUGIN_DIR"
          cp native/android-plugin/com/chakkimitra/plugin/BackgroundSmsPlugin.java "$PLUGIN_DIR/"
          echo "=== BackgroundSmsPlugin.java copied ==="
          cat "$PLUGIN_DIR/BackgroundSmsPlugin.java"

          # Verify both files exist
          echo "=== Verification ==="
          ls -la "$MAIN_DIR/MainActivity.java"
          ls -la "$PLUGIN_DIR/BackgroundSmsPlugin.java"

      - name: Configure signing
        if: steps.check-signing.outputs.has_signing == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/android-signing/release.keystore"
          KEYSTORE_PATH=$(realpath "$RUNNER_TEMP/android-signing/release.keystore")
          cd android
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$KEYSTORE_PATH"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> gradle.properties

      - name: Enable AndroidX
        run: |
          cd android
          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || \
            printf 'android.useAndroidX=true\n' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || \
            printf 'android.enableJetifier=true\n' >> gradle.properties

      - name: Patch build.gradle for signing
        if: steps.check-signing.outputs.has_signing == 'true'
        run: |
          cd android
          python3 << 'PYEOF'
          import re
          with open("app/build.gradle", "r") as f:
              content = f.read()
          # Add release signing config block
          signing = (
              "    signingConfigs {\n"
              "        release {\n"
              "            storeFile file(RELEASE_STORE_FILE)\n"
              "            storePassword RELEASE_STORE_PASSWORD\n"
              "            keyAlias RELEASE_KEY_ALIAS\n"
              "            keyPassword RELEASE_KEY_PASSWORD\n"
              "        }\n"
              "    }\n"
          )
          if "signingConfigs" not in content:
              content = content.replace("buildTypes {", signing + "    buildTypes {")
          # Apply release signing to release build type only (debug keeps default keystore)
          if "signingConfig signingConfigs.release" not in content:
              content, count = re.subn(
                  r"(buildTypes\s*\{[\s\S]*?\brelease\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  content,
                  count=1,
              )
          # Set debug applicationId to different package name
          debug_match = re.search(r"debug\s*\{([^}]*)\}", content, re.DOTALL)
          if debug_match and "applicationId" not in debug_match.group(1):
              old_debug = debug_match.group(0)
              new_debug = old_debug.replace("}", '    applicationId "com.chakkimitra.app.debug"\n    }')
              content = content.replace(old_debug, new_debug)
          with open("app/build.gradle", "w") as f:
              f.write(content)
          PYEOF

      - name: Get version code
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION_NAME="${TAG_NAME#v}"
          else
            VERSION_NAME=$(date +%Y.%-m.%-d)
          fi
          VERSION_CODE=$(($(date +%-y) * 10000 + $(date +%-m) * 100 + $(date +%-d)))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Update version in build.gradle
        run: |
          cd android
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" app/build.gradle

      - name: Build Release APK
        if: steps.check-signing.outputs.has_signing == 'true'
        continue-on-error: true
        id: release-build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Cleanup signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"

      - name: Upload Release APK
        if: steps.check-signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chakki-mitra-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chakki-mitra-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chakki Mitra v${{ steps.version.outputs.version_name }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
